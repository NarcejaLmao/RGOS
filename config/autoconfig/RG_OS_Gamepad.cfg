# RetroArch autoconfig for the RG OS input hub's virtual pad ("RG OS Gamepad", uinput, bus 0x19 vendor 0x484b product 0x14df).
# NOTE: not used by default any more (input_autodetect_enable = false; the binds are in retroarch.cfg).
# Every physical button of the RG Rotate (gpio-keys-gamepad) is merged into this one device by rgos-input.
#
# Button numbers are SDL joystick indices = the pad's evdev key codes in ascending order, which is what the hub advertises:
#   0 B (BTN_SOUTH 0x130)   1 A (BTN_EAST 0x131)    2 X (BTN_NORTH 0x133, top face)   3 Y (BTN_WEST 0x134, left face)
#   4 L (0x136)             5 R (0x137)             6 L2 (0x138)                      7 R2 (0x139)
#   8 SELECT (0x13a)        9 START (0x13b)        10 MENU (BTN_MODE 0x13c)          11 L3 (0x13d)   12 R3 (0x13e)
#  13 D-pad up (0x220)     14 down (0x221)         15 left (0x222)                   16 right (0x223)
# (There are no analog sticks: the D-pad is four buttons, so input_analog_dpad_mode stays off.)
input_driver = "sdl2"
input_device = "RG OS Gamepad"
input_device_display_name = "RG OS Gamepad"
input_vendor_id = "18507"
input_product_id = "5343"

# --- RetroPad ---------------------------------------------------------------------------------------------------
input_b_btn = "0"
input_a_btn = "1"
input_x_btn = "2"
input_y_btn = "3"
input_l_btn = "4"
input_r_btn = "5"
input_l2_btn = "6"
input_r2_btn = "7"
input_l3_btn = "11"
input_r3_btn = "12"
input_select_btn = "8"
input_start_btn = "9"
input_up_btn = "13"
input_down_btn = "14"
input_left_btn = "15"
input_right_btn = "16"

# --- Hotkeys: hold MENU, then press ------------------------------------------------------------------------------
#   MENU + START   leave the game (back to the RG OS launcher)
#   MENU + SELECT  RetroArch menu (press again to close it)
#   MENU + R       save state            MENU + L       load state
#   MENU + RIGHT   next state slot       MENU + LEFT    previous state slot
#   MENU + R2      fast-forward (hold)   MENU + A       pause / resume
#   MENU + X       screenshot
input_enable_hotkey_btn = "10"
input_exit_emulator_btn = "9"
input_menu_toggle_btn = "8"
input_save_state_btn = "5"
input_load_state_btn = "4"
input_state_slot_increase_btn = "16"
input_state_slot_decrease_btn = "15"
input_hold_fast_forward_btn = "7"
input_pause_toggle_btn = "1"
input_screenshot_btn = "2"
