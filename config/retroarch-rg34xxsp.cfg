# RG34XXSP only (build.sh installs it as /etc/rgos/retroarch-rg34xxsp.cfg; rgos-launch appends it after the shared retroarch.cfg).
# The input hub (rgos-input, "analog": true) publishes the two sticks as joydev axes in this order:
#   0 left X (ABS_X)   1 left Y (ABS_Y)   2 right X (ABS_RX)   3 right Y (ABS_RY)      range -32767..32767, 0 = centre
# The D-pad stays four buttons; sticks are real analog (input_analog_dpad_mode stays 0), so L3/R3 (buttons 11/12) are the stick clicks.
input_player1_l_x_plus_axis = "+0"
input_player1_l_x_minus_axis = "-0"
input_player1_l_y_plus_axis = "+1"
input_player1_l_y_minus_axis = "-1"
input_player1_r_x_plus_axis = "+2"
input_player1_r_x_minus_axis = "-2"
input_player1_r_y_plus_axis = "+3"
input_player1_r_y_minus_axis = "-3"
input_analog_deadzone = "0.15"
input_analog_sensitivity = "1.0"
