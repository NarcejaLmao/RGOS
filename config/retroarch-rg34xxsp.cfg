# RG34XXSP only (installed as /etc/rgos/retroarch-rg34xxsp.cfg and appended by rgos-launch).
# Explicit RetroPad button and hotkey bindings for the RG OS Gamepad created by rgos-input.
# Button indices are the virtual pad's joydev indices:
#   0 B  1 A  2 X  3 Y  4 L  5 R  6 L2  7 R2  8 SELECT  9 START  10 MENU
#   11 L3  12 R3  13 UP  14 DOWN  15 LEFT  16 RIGHT
# Analog axes: 0 left X, 1 left Y, 2 right X, 3 right Y.

# --- RetroPad button bindings ---
input_player1_b_btn = "0"
input_player1_a_btn = "1"
input_player1_x_btn = "2"
input_player1_y_btn = "3"
input_player1_l_btn = "4"
input_player1_r_btn = "5"
input_player1_l2_btn = "6"
input_player1_r2_btn = "7"
input_player1_select_btn = "8"
input_player1_start_btn = "9"
input_player1_l3_btn = "11"
input_player1_r3_btn = "12"
input_player1_up_btn = "13"
input_player1_down_btn = "14"
input_player1_left_btn = "15"
input_player1_right_btn = "16"

# --- Analog sticks ---
input_player1_l_x_plus_axis = "+0"
input_player1_l_x_minus_axis = "-0"
input_player1_l_y_plus_axis = "+1"
input_player1_l_y_minus_axis = "-1"
input_player1_r_x_plus_axis = "+2"
input_player1_r_x_minus_axis = "-2"
input_player1_r_y_plus_axis = "+3"
input_player1_r_y_minus_axis = "-3"
input_analog_dpad_mode = "0"
input_analog_deadzone = "0.15"
input_analog_sensitivity = "1.0"
# L2/R2 are digital buttons on this virtual pad, not analog triggers.
input_player1_l2_axis = "nul"
input_player1_r2_axis = "nul"

# --- Hotkeys: hold MENU (10), then press ---
# MENU + START exits to launcher; MENU + SELECT opens/closes RetroArch menu.
# MENU + R saves state; MENU + L loads state; MENU + LEFT/RIGHT changes state slot.
# MENU + R2 fast-forwards; MENU + L2 rewinds; MENU + A pauses; MENU + X screenshots.
input_enable_hotkey_btn = "10"
input_exit_emulator_btn = "9"
input_menu_toggle_btn = "8"
input_save_state_btn = "5"
input_load_state_btn = "4"
input_state_slot_increase_btn = "16"
input_state_slot_decrease_btn = "15"
input_hold_fast_forward_btn = "7"
input_rewind_btn = "6"
input_pause_toggle_btn = "1"
input_screenshot_btn = "2"
input_volume_up_btn = "13"
input_volume_down_btn = "14"
