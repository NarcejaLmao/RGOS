# RG35XX H only (build.sh installs it as /etc/rgos/retroarch-rg35xxh.cfg; rgos-launch appends it after the shared retroarch.cfg,
# before the per-launch run.cfg and the user's <ROMS>/config/retroarch.cfg, so both of those can still override it).
#
# Hardware: Allwinner H700, 640x480 (4:3) screen, D-pad, A/B/X/Y, L1/R1, L2/R2 (digital triggers), SELECT/START/MENU,
# two analog sticks with L3/R3 clicks. The input hub (rgos-input, "analog": true via /etc/rgos/input-rg35xxh.json) merges all of it
# into the single virtual pad "RG OS Gamepad".
#
# Buttons (joydev/SDL indices = the hub pad's evdev key codes in ascending order):
#   0 B   1 A   2 X   3 Y   4 L   5 R   6 L2   7 R2   8 SELECT   9 START   10 MENU   11 L3   12 R3   13 up   14 down   15 left   16 right
# Axes (range -32767..32767, 0 = centre):
#   0 left X (ABS_X)   1 left Y (ABS_Y)   2 right X (ABS_RX)   3 right Y (ABS_RY)

# --- Video: native 640x480 panel ------------------------------------------------------------------------------------------------
video_fullscreen = "true"
video_fullscreen_x = "640"
video_fullscreen_y = "480"
video_windowed_fullscreen = "false"
video_rotation = "0"
video_vsync = "true"
video_smooth = "false"
# 4:3 panel: aspect follows the content automatically, scaled to fit (non-integer so 240p/160p systems fill the screen)
video_aspect_ratio_auto = "true"
video_scale_integer = "false"
# rgui at 640x480 is readable at its default scale; keep the menu simple and fast
menu_driver = "rgui"
rgui_aspect_ratio_lock = "0"
menu_rgui_shadows = "false"

# --- RetroPad (player 1) -------------------------------------------------------------------------------------------------------
input_player1_b_btn = "0"
input_player1_a_btn = "1"
input_player1_x_btn = "2"
input_player1_y_btn = "3"
input_player1_l_btn = "4"
input_player1_r_btn = "5"
input_player1_l2_btn = "6"
input_player1_r2_btn = "7"
input_player1_select_btn = "8"
input_player1_start_btn = "9"
input_player1_l3_btn = "11"
input_player1_r3_btn = "12"
input_player1_up_btn = "13"
input_player1_down_btn = "14"
input_player1_left_btn = "15"
input_player1_right_btn = "16"

# --- Analog sticks (real analog; the D-pad stays four buttons, so input_analog_dpad_mode stays 0) -------------------------------
input_player1_l_x_plus_axis = "+0"
input_player1_l_x_minus_axis = "-0"
input_player1_l_y_plus_axis = "+1"
input_player1_l_y_minus_axis = "-1"
input_player1_r_x_plus_axis = "+2"
input_player1_r_x_minus_axis = "-2"
input_player1_r_y_plus_axis = "+3"
input_player1_r_y_minus_axis = "-3"
input_analog_dpad_mode = "0"
input_analog_deadzone = "0.15"
input_analog_sensitivity = "1.0"
# the triggers are digital buttons here, so no axis-as-trigger binds
input_player1_l2_axis = "nul"
input_player1_r2_axis = "nul"

# --- Hotkeys: hold MENU (10), then press -----------------------------------------------------------------------------------------
#   MENU + START   leave the game (back to the RG OS launcher)
#   MENU + SELECT  RetroArch menu (press again to close it)
#   MENU + R       save state            MENU + L       load state
#   MENU + RIGHT   next state slot       MENU + LEFT    previous state slot
#   MENU + R2      fast-forward (hold)   MENU + L2      rewind (hold; only works where rewind_enable is on)
#   MENU + A       pause / resume        MENU + X       screenshot
#   MENU + UP/DOWN volume up / down      (RetroArch's own mixer volume, not the system volume)
input_enable_hotkey_btn = "10"
input_exit_emulator_btn = "9"
input_menu_toggle_btn = "8"
input_save_state_btn = "5"
input_load_state_btn = "4"
input_state_slot_increase_btn = "16"
input_state_slot_decrease_btn = "15"
input_hold_fast_forward_btn = "7"
input_rewind_btn = "6"
input_pause_toggle_btn = "1"
input_screenshot_btn = "2"
input_volume_up_btn = "13"
input_volume_down_btn = "14"
