# RG OS RetroArch config (installed to /etc/rgos/retroarch.cfg by build.sh; rgos-launch passes it with --config and
# appends a per-launch file with the save/state/BIOS folders and the ALSA device).
# Software menu (rgui) + KMS output: no X11, no desktop GL stack needed beyond Mesa/Panfrost.
video_fullscreen = "true"
video_vsync = "true"
video_smooth = "false"
video_scale_integer = "false"
video_threaded = "false"
video_shader_enable = "false"
menu_driver = "rgui"
menu_mouse_enable = "false"
menu_pointer_enable = "false"
menu_show_load_core = "false"
menu_show_online_updater = "false"
menu_show_core_updater = "false"
menu_show_configurations = "false"

audio_driver = "alsa"
audio_enable = "true"
audio_sync = "true"

# Buttons come from the RG OS input hub's single virtual pad ("RG OS Gamepad"). There is no udev daemon in this image, so the
# joypad driver is linuxraw (reads /dev/input/jsN directly; rgos-launch can override it with /boot/retroarch-joypad.txt). The raw
# gpio-keys pad (js0) is grabbed by the hub and silent, so rgos-launch sets input_player1_joypad_index to the hub's jsN for every
# launch (appended config). Binds are explicit below instead of coming from an autoconfig profile, which needs a name match.
# Button numbers = the hub pad's evdev key codes in ascending order (same for joydev and SDL):
#   0 B  1 A  2 X  3 Y  4 L  5 R  6 L2  7 R2  8 SELECT  9 START  10 MENU  11 L3  12 R3  13 up  14 down  15 left  16 right
input_driver = "sdl2"
input_joypad_driver = "linuxraw"
input_autodetect_enable = "false"
joypad_autoconfig_dir = "/etc/rgos/autoconfig"
input_max_users = "1"
input_analog_dpad_mode = "0"
input_menu_toggle_gamepad_combo = "0"

input_player1_b_btn = "0"
input_player1_a_btn = "1"
input_player1_x_btn = "2"
input_player1_y_btn = "3"
input_player1_l_btn = "4"
input_player1_r_btn = "5"
input_player1_l2_btn = "6"
input_player1_r2_btn = "7"
input_player1_l3_btn = "11"
input_player1_r3_btn = "12"
input_player1_select_btn = "8"
input_player1_start_btn = "9"
input_player1_up_btn = "13"
input_player1_down_btn = "14"
input_player1_left_btn = "15"
input_player1_right_btn = "16"

# Hotkeys: hold MENU (10) and press: START exit to launcher, SELECT RetroArch menu, R save state, L load state,
# RIGHT/LEFT state slot, R2 fast-forward (hold), A pause, X screenshot.
input_enable_hotkey_btn = "10"
input_exit_emulator_btn = "9"
input_menu_toggle_btn = "8"
input_save_state_btn = "5"
input_load_state_btn = "4"
input_state_slot_increase_btn = "16"
input_state_slot_decrease_btn = "15"
input_hold_fast_forward_btn = "7"
input_pause_toggle_btn = "1"
input_screenshot_btn = "2"

# Behave like a console, not a PC: no prompts, nothing written back to the read-only system image.
config_save_on_exit = "false"
quit_press_twice = "false"
confirm_on_exit = "false"
pause_nonactive = "false"
rewind_enable = "false"
savestate_auto_save = "false"
savestate_auto_load = "false"
savefile_directory = "/media/roms/saves"
savestate_directory = "/media/roms/states"
system_directory = "/media/roms/bios"
screenshot_directory = "/media/roms/screenshots"
libretro_directory = "/usr/lib/aarch64-linux-gnu/libretro"
libretro_info_path = "/usr/share/libretro/info"
log_to_file = "true"
network_cmd_enable = "true"
network_cmd_port = "55355"
