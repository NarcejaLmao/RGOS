# RG OS RetroArch base config (RG34XX-SP). rgos-launch passes this with --config and then appends a per-launch file
# (/run/rgos/retroarch-run.cfg: save/state folders, ALSA device) and, last, an optional user file on the ROMS card:
#   <ROMS>/config/retroarch.cfg     <- put your own overrides here; they win over everything below.
# Nothing is written back to this file (config_save_on_exit = false).

# ---- video: Mesa/Panfrost GLES straight to KMS/DRM; 720x480 panel = 3x the GBA's 240x160 ------------------------------
video_driver = "gl"
video_context_driver = "kms"
video_fullscreen = "true"
video_windowed_fullscreen = "true"
video_vsync = "true"
video_smooth = "false"
video_scale_integer = "true"
video_aspect_ratio_auto = "true"
video_threaded = "false"
video_font_enable = "true"
video_shader_enable = "false"

# ---- audio: ALSA; the device line is generated per launch from the card hwctl picks ------------------------------------
audio_driver = "alsa"
audio_enable = "true"
audio_out_rate = "48000"
audio_latency = "64"
audio_sync = "true"
audio_enable_menu = "false"

# ---- input: raw kernel joystick (joydev) device of the "RG OS Gamepad" made by rgos-sticks; no udev here ---------------
# Button numbers = joydev order of the hub's key codes (same numbering as /etc/rgos/input.json).
input_driver = "sdl2"
input_joypad_driver = "linuxraw"
input_autodetect_enable = "false"
input_player1_joypad_index = "0"
input_max_users = "1"
input_player1_b_btn = "0"
input_player1_a_btn = "1"
input_player1_x_btn = "2"
input_player1_y_btn = "3"
input_player1_l_btn = "4"
input_player1_r_btn = "5"
input_player1_l2_btn = "6"
input_player1_r2_btn = "7"
input_player1_select_btn = "8"
input_player1_start_btn = "9"
input_player1_up_btn = "13"
input_player1_down_btn = "14"
input_player1_left_btn = "15"
input_player1_right_btn = "16"
# left stick also steers the D-pad (GBA has no analog input); axes 0/1 = X/Y of the hub
input_player1_analog_dpad_mode = "1"
input_player1_l_x_plus_axis = "+0"
input_player1_l_x_minus_axis = "-0"
input_player1_l_y_plus_axis = "+1"
input_player1_l_y_minus_axis = "-1"
input_player1_r_x_plus_axis = "+2"
input_player1_r_x_minus_axis = "-2"
input_player1_r_y_plus_axis = "+3"
input_player1_r_y_minus_axis = "-3"
input_axis_threshold = "0.5"

# ---- hotkeys: HOLD the MENU button (btn 10), then press ----------------------------------------------------------------
#   MENU+START = quit    MENU+SELECT = RetroArch menu    MENU+R = save state    MENU+L = load state
#   MENU+X = fast-forward (toggle)    MENU+Y = pause
input_enable_hotkey_btn = "10"
input_exit_emulator_btn = "9"
input_menu_toggle_btn = "8"
input_save_state_btn = "5"
input_load_state_btn = "4"
input_toggle_fast_forward_btn = "2"
input_pause_toggle_btn = "3"

# ---- menu: RGUI needs no asset files ---------------------------------------------------------------------------------------
menu_driver = "rgui"
menu_mouse_enable = "false"
menu_pointer_enable = "false"
menu_show_advanced_settings = "false"
menu_unified_controls = "true"
rgui_show_start_screen = "false"
menu_show_online_updater = "false"
menu_show_core_updater = "false"
menu_show_load_core = "true"
menu_show_restart_retroarch = "false"
menu_show_quit_retroarch = "true"
menu_show_configurations = "false"
menu_show_overlays = "false"

# ---- behaviour -----------------------------------------------------------------------------------------------------------------
config_save_on_exit = "false"
quit_press_twice = "false"
pause_nonactive = "false"
rewind_enable = "false"
fastforward_ratio = "0.0"
savestate_auto_save = "false"
savestate_auto_load = "false"
savestate_thumbnail_enable = "false"
# flush battery saves (.srm) every 10 s so a power-off mid-game does not lose them
autosave_interval = "10"
network_cmd_enable = "false"
stdin_cmd_enable = "false"
log_to_file = "false"
log_verbosity = "true"
core_options_path = "/etc/rgos/retroarch-core-options.cfg"
global_core_options = "true"

# ---- paths (state/save/system folders are set per launch) -----------------------------------------------------------------
libretro_directory = "/usr/lib/libretro"
libretro_info_path = "/usr/share/libretro/info"
content_directory = "/media/roms/roms"
cache_directory = "/tmp/retroarch"
