name: Build RGOS image or update

on:
  workflow_dispatch:
    inputs:
      board:
        description: Which device build to run
        required: true
        type: choice
        options:
          - rg-rotate
          - rg34xxsp
        default: rg-rotate
      artifact:
        description: What to build
        required: true
        type: choice
        options:
          - img
          - update-tar
        default: img
      build_id:
        description: Optional build ID (blank uses UTC timestamp)
        required: false
        type: string
        default: ''
      ddr_variant:
        description: rg34xxsp only - ROCKNIX H700 memory variant used for boot assets
        required: true
        type: choice
        options:
          - DDR4
          - DDR3
        default: DDR4
      build_psx:
        description: rg-rotate only - build the PlayStation core from source (slow under emulation; off skips it)
        required: true
        type: boolean
        default: true
      update_extlinux:
        description: rg-rotate update-tar only - also include extlinux.conf in the update
        required: true
        type: boolean
        default: false
      rocknix_url:
        description: rg-rotate only - override the ROCKNIX-T618 image URL (blank uses the build.sh default)
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: rgos-build-${{ inputs.board }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # A self-hosted Linux runner with ample disk/RAM may be needed if GitHub-hosted
    # runner disk space is insufficient for Buildroot plus the upstream image.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out RGOS
        uses: actions/checkout@v4

      - name: Install host dependencies (rg34xxsp)
        if: inputs.board == 'rg34xxsp'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc build-essential cpio curl file g++ gcc git gzip libncurses-dev \
            make mtools patch perl python3 python3-pip python3-setuptools \
            rsync squashfs-tools unzip wget xz-utils dosfstools \
            e2fsprogs fdisk util-linux

      - name: Prepare build ID
        id: metadata
        shell: bash
        env:
          INPUT_BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          build_id="$INPUT_BUILD_ID"
          if [[ -z "$build_id" ]]; then
            build_id="$(date -u +%Y%m%d-%H%M%S)"
          fi
          # Keep IDs safe for the update manifest and artifact filenames.
          if [[ ! "$build_id" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then
            echo "Invalid build ID: use 1-64 letters, digits, dots, underscores or hyphens." >&2
            exit 2
          fi
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "Building ${{ inputs.board }} artifact: ${{ inputs.artifact }} (ID: $build_id)"

      - name: Build disk image (rg34xxsp)
        if: inputs.board == 'rg34xxsp' && inputs.artifact == 'img'
        env:
          RGOS_BUILD_ID: ${{ steps.metadata.outputs.build_id }}
          RGOS_JOBS: '2'
          RGOS_H700_DDR: ${{ inputs.ddr_variant }}
        run: |
          set -euo pipefail
          bash ./build.sh prepare
          bash ./build.sh build
          test -s output/rgos-rg34xxsp.img

      - name: Build update tar (rg34xxsp)
        if: inputs.board == 'rg34xxsp' && inputs.artifact == 'update-tar'
        env:
          RGOS_BUILD_ID: ${{ steps.metadata.outputs.build_id }}
          RGOS_JOBS: '2'
          RGOS_H700_DDR: ${{ inputs.ddr_variant }}
        run: |
          set -euo pipefail
          bash ./build.sh prepare
          bash ./build.sh update
          test -s "output/rgos-update-${RGOS_BUILD_ID}.tar"

      - name: Verify update archive (rg34xxsp)
        if: inputs.board == 'rg34xxsp' && inputs.artifact == 'update-tar'
        env:
          RGOS_BUILD_ID: ${{ steps.metadata.outputs.build_id }}
        run: |
          python3 - "$RGOS_BUILD_ID" "output/rgos-update-${RGOS_BUILD_ID}.tar" <<'PY'
          import json, sys, tarfile
          build_id, path = sys.argv[1:]
          with tarfile.open(path, 'r:') as archive:
              names = archive.getnames()
              if 'manifest.json' not in names:
                  raise SystemExit('Update tar has no manifest.json')
              manifest = json.load(archive.extractfile('manifest.json'))
              if manifest.get('id') != build_id:
                  raise SystemExit('Update manifest build ID mismatch')
              if 'boot/rgos-initrd.gz' not in names or 'boot/extlinux/extlinux.conf' not in names:
                  raise SystemExit('Update tar is missing required boot files')
              for name, digest in manifest.get('files', {}).items():
                  member = archive.extractfile('boot/' + name)
                  if member is None:
                      raise SystemExit(f'Manifest file missing from archive: {name}')
                  import hashlib
                  actual = hashlib.sha256(member.read()).hexdigest()
                  if actual != digest:
                      raise SystemExit(f'SHA-256 mismatch: {name}')
          print(f'Validated update archive: {path}')
          PY

      - name: Upload disk image (rg34xxsp)
        if: inputs.board == 'rg34xxsp' && inputs.artifact == 'img'
        uses: actions/upload-artifact@v4
        with:
          name: rgos-${{ steps.metadata.outputs.build_id }}-img
          path: output/rgos-rg34xxsp.img
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload update tar (rg34xxsp)
        if: inputs.board == 'rg34xxsp' && inputs.artifact == 'update-tar'
        uses: actions/upload-artifact@v4
        with:
          name: rgos-${{ steps.metadata.outputs.build_id }}-update-tar
          path: output/rgos-update-${{ steps.metadata.outputs.build_id }}.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # ---------------------------------------------------------------------------------------------
      # RG Rotate (boards/other/rg-rotate): Debian rootfs on top of the stock ROCKNIX-T618 image.
      # build.sh needs root, loop devices, debootstrap and qemu-user-static (arm64 chroot).
      # ---------------------------------------------------------------------------------------------
      - name: Free disk space (rg-rotate)
        if: inputs.board == 'rg-rotate'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Install host dependencies (rg-rotate)
        if: inputs.board == 'rg-rotate'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap debian-archive-keyring qemu-user-static binfmt-support \
            squashfs-tools wget gdisk dosfstools e2fsprogs fdisk util-linux \
            git python3 xz-utils gzip ca-certificates
          # Ubuntu's debootstrap may not ship a script for the Debian suite build.sh uses (default: trixie)
          suite="${DEBIAN_SUITE:-trixie}"
          if [[ ! -e "/usr/share/debootstrap/scripts/$suite" ]]; then
            sudo ln -s sid "/usr/share/debootstrap/scripts/$suite"
          fi
          # the arm64 chroot needs the qemu binfmt handler registered
          if [[ ! -e /proc/sys/fs/binfmt_misc/qemu-aarch64 ]]; then
            sudo update-binfmts --enable qemu-aarch64 || true
          fi
          test -e /proc/sys/fs/binfmt_misc/qemu-aarch64 || { echo "qemu-aarch64 binfmt handler is not registered" >&2; exit 1; }

      - name: Build disk image (rg-rotate)
        if: inputs.board == 'rg-rotate' && inputs.artifact == 'img'
        env:
          BUILD_PSX: ${{ inputs.build_psx }}
          ROCKNIX_URL_INPUT: ${{ inputs.rocknix_url }}
        run: |
          set -euo pipefail
          [[ "$BUILD_PSX" == "true" ]] || export PSX_REPO=none
          [[ -z "$ROCKNIX_URL_INPUT" ]] || export ROCKNIX_URL="$ROCKNIX_URL_INPUT"
          bash ./build.sh rg-rotate image
          test -s boards/other/rg-rotate/out/rg-rotate-rgos.img

      - name: Verify disk image (rg-rotate)
        if: inputs.board == 'rg-rotate' && inputs.artifact == 'img'
        working-directory: boards/other/rg-rotate
        run: |
          set -euo pipefail
          img=out/rg-rotate-rgos.img
          loop="$(sudo losetup -Pfr --show "$img")"
          mnt="$(mktemp -d)"
          cleanup() { set +e; mountpoint -q "$mnt" && sudo umount "$mnt"; sudo losetup -d "$loop"; }
          trap cleanup EXIT
          sudo partprobe "$loop" 2>/dev/null || true
          for _ in 1 2 3 4 5; do [[ -b "${loop}p1" ]] && break; sleep 1; done

          label="$(sudo blkid -s LABEL -o value "${loop}p1")"
          [[ "$label" == "RGOS" ]] || { echo "Boot partition label is '$label', expected RGOS" >&2; exit 1; }
          sudo sgdisk -i 3 "$img" | grep -q "^Partition name: 'uboot'" \
            || { echo "Partition 3 is not 'uboot': the device would boot Android" >&2; exit 1; }

          sudo mount -o ro "${loop}p1" "$mnt"
          for f in SYSTEM rgos-initrd.cpio extlinux/extlinux.conf extlinux/extlinux.conf.stock; do
            test -s "$mnt/$f" || { echo "Boot partition is missing $f" >&2; exit 1; }
          done
          grep -q 'rdinit=/rgos-init' "$mnt/extlinux/extlinux.conf" || { echo "extlinux.conf has no rdinit=/rgos-init" >&2; exit 1; }
          if grep -rqi 'LABEL=ROCKNIX' "$mnt/extlinux"; then
            echo "extlinux still references LABEL=ROCKNIX" >&2; exit 1
          fi
          echo "Validated $img: label RGOS, uboot partition, SYSTEM + initramfs present."

      - name: Compress disk image (rg-rotate)
        if: inputs.board == 'rg-rotate' && inputs.artifact == 'img'
        working-directory: boards/other/rg-rotate/out
        run: |
          sudo gzip -6 -f rg-rotate-rgos.img
          ls -la rg-rotate-rgos.img.gz

      - name: Build update tar (rg-rotate)
        if: inputs.board == 'rg-rotate' && inputs.artifact == 'update-tar'
        env:
          UPDATE_ID: ${{ steps.metadata.outputs.build_id }}
          BUILD_PSX: ${{ inputs.build_psx }}
          INCLUDE_EXTLINUX: ${{ inputs.update_extlinux }}
          ROCKNIX_URL_INPUT: ${{ inputs.rocknix_url }}
        run: |
          set -euo pipefail
          [[ "$BUILD_PSX" == "true" ]] || export PSX_REPO=none
          [[ "$INCLUDE_EXTLINUX" != "true" ]] || export UPDATE_EXTLINUX=1
          [[ -z "$ROCKNIX_URL_INPUT" ]] || export ROCKNIX_URL="$ROCKNIX_URL_INPUT"
          bash ./build.sh rg-rotate update
          test -s "boards/other/rg-rotate/out/rgos-update-${UPDATE_ID}.tar"

      - name: Verify update archive (rg-rotate)
        if: inputs.board == 'rg-rotate' && inputs.artifact == 'update-tar'
        env:
          RGOS_BUILD_ID: ${{ steps.metadata.outputs.build_id }}
        run: |
          python3 - "$RGOS_BUILD_ID" "boards/other/rg-rotate/out/rgos-update-${RGOS_BUILD_ID}.tar" <<'PY'
          import hashlib, json, sys, tarfile
          build_id, path = sys.argv[1:]
          with tarfile.open(path, 'r:') as archive:
              names = archive.getnames()
              if 'manifest.json' not in names:
                  raise SystemExit('Update tar has no manifest.json')
              manifest = json.load(archive.extractfile('manifest.json'))
              if manifest.get('id') != build_id:
                  raise SystemExit('Update manifest build ID mismatch')
              if manifest.get('device') != 'rg-rotate':
                  raise SystemExit('Update manifest device is not rg-rotate')
              files = manifest.get('files', {})
              for required in ('SYSTEM', 'rgos-initrd.cpio'):
                  if required not in files or 'boot/' + required not in names:
                      raise SystemExit(f'Update tar is missing {required}')
              for name, digest in files.items():
                  member = archive.extractfile('boot/' + name)
                  if member is None:
                      raise SystemExit(f'Manifest file missing from archive: {name}')
                  h = hashlib.sha256()
                  for chunk in iter(lambda: member.read(1 << 20), b''):
                      h.update(chunk)
                  if h.hexdigest() != digest:
                      raise SystemExit(f'SHA-256 mismatch: {name}')
          print(f'Validated update archive: {path}')
          PY

      - name: Upload disk image (rg-rotate)
        if: inputs.board == 'rg-rotate' && inputs.artifact == 'img'
        uses: actions/upload-artifact@v4
        with:
          name: rg-rotate-rgos-${{ steps.metadata.outputs.build_id }}-img
          path: boards/other/rg-rotate/out/rg-rotate-rgos.img.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload update tar (rg-rotate)
        if: inputs.board == 'rg-rotate' && inputs.artifact == 'update-tar'
        uses: actions/upload-artifact@v4
        with:
          name: rg-rotate-rgos-${{ steps.metadata.outputs.build_id }}-update-tar
          path: boards/other/rg-rotate/out/rgos-update-${{ steps.metadata.outputs.build_id }}.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
