name: Build RGOS image or update

on:
  workflow_dispatch:
    inputs:
      device:
        description: Which device to build for
        required: true
        type: choice
        options:
          - rg34xxsp
          - rg35xxh
          - rg-rotate
          - all
        default: rg34xxsp
      artifact:
        description: What to build
        required: true
        type: choice
        options:
          - img
          - update-tar
        default: img
      build_id:
        description: Optional build ID (blank uses UTC timestamp)
        required: false
        type: string
        default: ''
      build_psx:
        description: build the PlayStation core from source (slow under emulation; off skips it)
        required: true
        type: boolean
        default: true
      build_gc:
        description: RG Rotate only - build the GameCube core (Dolphin libretro) from source (very slow under emulation; off skips it)
        required: true
        type: boolean
        default: true
      update_extlinux:
        description: update-tar only - also include extlinux.conf in the update
        required: true
        type: boolean
        default: false
      rocknix_url:
        description: override the stock ROCKNIX image URL (blank uses the build.sh default; not allowed with device=all, the devices use different images)
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: rgos-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # A self-hosted Linux runner with ample disk/RAM may be needed if GitHub-hosted
    # runner disk space is insufficient for the Debian rootfs plus the upstream image.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out RGOS
        uses: actions/checkout@v4

      - name: Prepare build ID
        id: metadata
        shell: bash
        env:
          INPUT_BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          build_id="$INPUT_BUILD_ID"
          if [[ -z "$build_id" ]]; then
            build_id="$(date -u +%Y%m%d-%H%M%S)"
          fi
          # Keep IDs safe for the update manifest and artifact filenames.
          if [[ ! "$build_id" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then
            echo "Invalid build ID: use 1-64 letters, digits, dots, underscores or hyphens." >&2
            exit 2
          fi
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          if [[ "${{ inputs.device }}" == "all" && -n "${{ inputs.rocknix_url }}" ]]; then
            echo "rocknix_url cannot be combined with device=all (each device has its own stock image)." >&2
            exit 2
          fi
          echo "Building ${{ inputs.device }} artifact: ${{ inputs.artifact }} (ID: $build_id)"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap debian-archive-keyring qemu-user-static binfmt-support \
            squashfs-tools wget gdisk dosfstools e2fsprogs fdisk util-linux \
            git python3 xz-utils gzip ca-certificates
          # Ubuntu's debootstrap may not ship a script for the Debian suite build.sh uses (default: trixie)
          suite="${DEBIAN_SUITE:-trixie}"
          if [[ ! -e "/usr/share/debootstrap/scripts/$suite" ]]; then
            sudo ln -s sid "/usr/share/debootstrap/scripts/$suite"
          fi
          # the arm64 chroot needs the qemu binfmt handler registered
          if [[ ! -e /proc/sys/fs/binfmt_misc/qemu-aarch64 ]]; then
            sudo update-binfmts --enable qemu-aarch64 || true
          fi
          test -e /proc/sys/fs/binfmt_misc/qemu-aarch64 || { echo "qemu-aarch64 binfmt handler is not registered" >&2; exit 1; }

      - name: Build disk image
        if: inputs.artifact == 'img'
        env:
          DEVICE: ${{ inputs.device }}
          BUILD_PSX: ${{ inputs.build_psx }}
          BUILD_GC: ${{ inputs.build_gc }}
          ROCKNIX_URL_INPUT: ${{ inputs.rocknix_url }}
        run: |
          set -euo pipefail
          [[ "$BUILD_PSX" == "true" ]] || export PSX_REPO=none
          [[ "$BUILD_GC" == "true" ]] || export GC_REPO=none
          [[ -z "$ROCKNIX_URL_INPUT" ]] || export ROCKNIX_URL="$ROCKNIX_URL_INPUT"
          bash ./build.sh "$DEVICE" image
          if [[ "$DEVICE" == "all" ]]; then
            test -s out/rg-rotate-rgos.img && test -s out/rg34xxsp-rgos.img && test -s out/rg35xxh-rgos.img
          else
            test -s "out/$DEVICE-rgos.img"
          fi

      - name: Verify disk image
        if: inputs.artifact == 'img'
        run: |
          set -euo pipefail
          verify() {
            local img="$1" ptable="$2" loop mnt label
            loop="$(sudo losetup -Pfr --show "$img")"
            mnt="$(mktemp -d)"
            sudo partprobe "$loop" 2>/dev/null || true
            for _ in 1 2 3 4 5; do [[ -b "${loop}p1" ]] && break; sleep 1; done
            label="$(sudo blkid -s LABEL -o value "${loop}p1")"
            [[ "$label" == "ROCKNIX" ]] || { echo "$img: boot partition label is '$label', expected ROCKNIX" >&2; sudo losetup -d "$loop"; return 1; }
            if [[ "$ptable" == gpt ]]; then
              sudo sgdisk -i 3 "$img" | grep -q "^Partition name: 'uboot'" \
                || { echo "$img: partition 3 is not 'uboot': the device would boot Android" >&2; sudo losetup -d "$loop"; return 1; }
            else
              sfdisk -d "$img" | grep -q '^label: dos' \
                || { echo "$img: not an MBR image" >&2; sudo losetup -d "$loop"; return 1; }
            fi
            sudo mount -o ro "${loop}p1" "$mnt"
            local rc=0 f
            for f in SYSTEM rgos-initrd.cpio extlinux/extlinux.conf extlinux/extlinux.conf.stock; do
              test -s "$mnt/$f" || { echo "$img: boot partition is missing $f" >&2; rc=1; }
            done
            if [[ "$ptable" == dos ]]; then
              test -s "$mnt/dtb.img" || { echo "$img: boot partition is missing dtb.img" >&2; rc=1; }
            fi
            grep -q 'rdinit=/rgos-init' "$mnt/extlinux/extlinux.conf" || { echo "$img: extlinux.conf has no rdinit=/rgos-init" >&2; rc=1; }
            sudo umount "$mnt"; sudo losetup -d "$loop"
            (( rc == 0 )) && echo "Validated $img: label ROCKNIX, $ptable partition table, SYSTEM + initramfs present."
            return $rc
          }
          case "${{ inputs.device }}" in
            rg34xxsp)  verify out/rg34xxsp-rgos.img dos ;;
            rg35xxh)   verify out/rg35xxh-rgos.img dos ;;
            rg-rotate) verify out/rg-rotate-rgos.img gpt ;;
            all)       verify out/rg-rotate-rgos.img gpt; verify out/rg34xxsp-rgos.img dos; verify out/rg35xxh-rgos.img dos ;;
          esac

      - name: Compress disk image
        if: inputs.artifact == 'img'
        working-directory: out
        run: |
          sudo gzip -6 -f ./*-rgos.img
          ls -la ./*-rgos.img.gz

      - name: Build update tar
        if: inputs.artifact == 'update-tar'
        env:
          DEVICE: ${{ inputs.device }}
          UPDATE_ID: ${{ steps.metadata.outputs.build_id }}
          BUILD_PSX: ${{ inputs.build_psx }}
          BUILD_GC: ${{ inputs.build_gc }}
          INCLUDE_EXTLINUX: ${{ inputs.update_extlinux }}
          ROCKNIX_URL_INPUT: ${{ inputs.rocknix_url }}
        run: |
          set -euo pipefail
          [[ "$BUILD_PSX" == "true" ]] || export PSX_REPO=none
          [[ "$BUILD_GC" == "true" ]] || export GC_REPO=none
          [[ "$INCLUDE_EXTLINUX" != "true" ]] || export UPDATE_EXTLINUX=1
          [[ -z "$ROCKNIX_URL_INPUT" ]] || export ROCKNIX_URL="$ROCKNIX_URL_INPUT"
          bash ./build.sh "$DEVICE" update
          if [[ "$DEVICE" == "all" ]]; then
            test -s "out/rgos-update-rg-rotate-${UPDATE_ID}.tar" && test -s "out/rgos-update-rg34xxsp-${UPDATE_ID}.tar" && test -s "out/rgos-update-rg35xxh-${UPDATE_ID}.tar"
          else
            test -s "out/rgos-update-${DEVICE}-${UPDATE_ID}.tar"
          fi

      - name: Verify update archive
        if: inputs.artifact == 'update-tar'
        env:
          RGOS_BUILD_ID: ${{ steps.metadata.outputs.build_id }}
        run: |
          python3 - "$RGOS_BUILD_ID" out/rgos-update-*-"$RGOS_BUILD_ID".tar <<'PY'
          import hashlib, json, os, re, sys, tarfile
          build_id, paths = sys.argv[1], sys.argv[2:]
          if not paths:
              raise SystemExit('No update tar was produced')
          for path in paths:
              device = re.fullmatch(r'rgos-update-(.+)-' + re.escape(build_id) + r'\.tar', os.path.basename(path)).group(1)
              with tarfile.open(path, 'r:') as archive:
                  names = archive.getnames()
                  if 'manifest.json' not in names:
                      raise SystemExit(path + ': no manifest.json')
                  manifest = json.load(archive.extractfile('manifest.json'))
                  if manifest.get('id') != build_id:
                      raise SystemExit(path + ': manifest build ID mismatch')
                  if manifest.get('device') != device:
                      raise SystemExit(path + ': manifest device is not ' + device)
                  files = manifest.get('files', {})
                  for required in ('SYSTEM', 'rgos-initrd.cpio'):
                      if required not in files or 'boot/' + required not in names:
                          raise SystemExit(path + ': missing ' + required)
                  for name, digest in files.items():
                      member = archive.extractfile('boot/' + name)
                      if member is None:
                          raise SystemExit(path + ': manifest file missing from archive: ' + name)
                      h = hashlib.sha256()
                      for chunk in iter(lambda: member.read(1 << 20), b''):
                          h.update(chunk)
                      if h.hexdigest() != digest:
                          raise SystemExit(path + ': SHA-256 mismatch: ' + name)
              print('Validated update archive: ' + path)
          PY

      - name: Upload disk image
        if: inputs.artifact == 'img'
        uses: actions/upload-artifact@v4
        with:
          name: rgos-${{ inputs.device }}-${{ steps.metadata.outputs.build_id }}-img
          path: out/*-rgos.img.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload update tar
        if: inputs.artifact == 'update-tar'
        uses: actions/upload-artifact@v4
        with:
          name: rgos-${{ inputs.device }}-${{ steps.metadata.outputs.build_id }}-update-tar
          path: out/rgos-update-*-${{ steps.metadata.outputs.build_id }}.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
