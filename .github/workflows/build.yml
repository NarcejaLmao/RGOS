# Save as .github/workflows/build.yml in your RGOS repo.
# Builds out/rgos-update-<BUILD_ID>.tar (copy it to <ROMS>/update/ on the device) and uploads it as an artifact.
# Run it from the Actions tab (Run workflow), on every push to main, or push a tag like v1.0 to also publish a Release.
name: Build RG OS update

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device"
        type: choice
        options: [rg34xxsp, rg35xxsp]
        default: rg34xxsp
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write        # needed only to attach the tar to a Release on tag pushes

jobs:
  build:
    # x86 runner: arm64 packages are built through qemu (slower, 30-60 min).
    # On a PUBLIC repo you can use the native arm runner instead (no qemu, much faster): runs-on: ubuntu-24.04-arm
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DEVICE: ${{ github.event.inputs.device || 'rg34xxsp' }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the ROCKNIX image + rootfs need ~15 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap debian-archive-keyring qemu-user-static binfmt-support \
            gcc-aarch64-linux-gnu make git gcc fdisk dosfstools e2fsprogs squashfs-tools \
            cpio file curl python3 python3-pil jq xz-utils unzip
          # older debootstrap releases may not know "trixie" yet
          [ -e /usr/share/debootstrap/scripts/trixie ] || sudo ln -s sid /usr/share/debootstrap/scripts/trixie

      - name: Run the tests
        run: python3 -m unittest discover -s tests -p "test_*.py"

      - name: Build (boot files, rootfs, image and update tar)
        run: |
          chmod +x build.sh build tools/* 2>/dev/null || true   # the exec bit is lost when files are zipped/uploaded
          export BUILD_ID="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          bash ./build.sh "$DEVICE" all

      - name: Locate the update tar
        run: |
          ls -lh out*/ || true
          ls -lh out*/rgos-update-*.tar

      - uses: actions/upload-artifact@v4
        with:
          name: rgos-update-${{ env.DEVICE }}-${{ env.BUILD_ID }}
          path: out*/rgos-update-*.tar
          if-no-files-found: error
          compression-level: 0        # the tar already contains a gzip'd rootfs

      - name: Attach to Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out*/rgos-update-*.tar
