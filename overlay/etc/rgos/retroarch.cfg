# RG OS RetroArch config (RG34XX-SP, 720x480). Per-run save/state dirs are appended by rgos-session.
video_driver = "gl"
video_context_driver = "kms"
video_fullscreen = "true"
# Disable KMS vblank waits: some H700/Panfrost builds stall during first game frame.
video_vsync = "false"
# NO threaded video: with the KMS/EGL context it deadlocks (frame hand-over between the emulation and video threads)
# and freezes the whole device on the first frame. rgos-raguard + rgos-session fall back to the sdl2 driver if it still hangs.
video_threaded = "false"
video_smooth = "false"
video_scale_integer = "false"
# alsathread: a stalled ALSA write can no longer block the main loop (and with it the video / input handling)
audio_driver = "alsathread"
audio_latency = "64"
input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
input_max_users = "1"
menu_driver = "rgui"
menu_show_quit_menu_entry = "true"
pause_nonactive = "false"
config_save_on_exit = "false"
network_cmd_enable = "true"
network_cmd_port = "55355"
rgui_show_start_screen = "false"
savefile_directory = "/media/roms/saves"
savestate_directory = "/media/roms/states"
system_directory = "/media/roms/firmware"
screenshot_directory = "/media/roms/screenshots"
core_updater_auto_extract_archive = "false"
# Hold SELECT+START to open the menu is handled by rgos-portkey (kills the process); use hotkey + START to quit cleanly.
input_enable_hotkey_btn = "8"
input_exit_emulator_btn = "9"
input_menu_toggle_btn = "10"
input_save_state_btn = "5"
input_load_state_btn = "4"
