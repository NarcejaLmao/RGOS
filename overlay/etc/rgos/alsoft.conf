# OpenAL Soft settings for PortMaster (its splash/GUI use OpenAL). Used via ALSOFT_CONF, see /opt/rgos/PortMaster.sh.
# Without this OpenAL first probes PipeWire (not installed: "can't load config client.conf", "Failed to create
# PipeWire event context") and its ALSA backend then logged "Wait timeout... buffer size too low?" for ~8 s before
# PortMaster started.
[general]
drivers=alsa
[alsa]
mmap=false
period_size=2048
periods=4
