# RG OS ports tuning (read by /opt/rgos/rgos-perf and rgos-session while a port runs).
# Everything here only applies while a port is running and is undone when it exits.
GOVERNOR=performance        # CPU governor for ports (performance | schedutil | ondemand ...). Menu/emulators are unaffected.
DEVFREQ_GOVERNOR=none       # GPU / memory-bus governor ("performance" to force max clocks). Off for now: on the RG34XX-SP forcing the GPU clock
                            # logged a kernel clk "ccu_helper_wait_for_lock" warning; set back to performance once ports run.
READ_AHEAD_KB=2048          # SD card read-ahead: much faster level / asset loading
QUIET_CONSOLE=1             # stop kernel messages being drawn on the console during the game
PIN_HELPERS=1               # keep rgos-sticks / rgos-volume / rgos-portkey on CPU0 so they do not interrupt game threads
PORT_NICE=-5                # scheduling priority of the port (-20 = highest .. 19 = lowest)
MESA_NO_ERROR=1             # Mesa skips GL error checking (free speed-up; set 0 if a port misbehaves)
MESA_GLTHREAD=true          # Mesa offloads GL calls to a second thread (set false if a port crashes or glitches)
